[package]
name = "novel-agent-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "novel_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
novel-domain = { path = "../../../crates/domain" }
novel-kernel = { path = "../../../crates/kernel" }
novel-extensions = { path = "../../../crates/extensions" }
novel-storage = { path = "../../../crates/storage" }
novel-automation = { path = "../../../crates/automation" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
